services:
  - type: web
    name: trading212-connector
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 60 wsgi:app
    healthCheckPath: /health
    disk:
      name: connector-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: T212_ENV
        value: live
      - key: ENABLE_TRADING
        value: "true"
      - key: STATE_DB
        value: /var/data/connector.sqlite
      - key: T212_API_KEY
        sync: false
      - key: T212_API_SECRET
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: OAUTH_CLIENT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: OAUTH_REDIRECT_URI
        sync: false
